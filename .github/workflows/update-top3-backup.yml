name: TOP-3 Stoloto backup updater

on:
  workflow_dispatch:
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'

permissions:
  contents: write

concurrency:
  group: yulia-top3-stoloto-oauth
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.54.2
          npx playwright install --with-deps chromium

      - name: Backup update from official Stoloto
        env:
          STOLOTO_EMAIL: ${{ secrets.STOLOTO_EMAIL }}
          STOLOTO_PASSWORD: ${{ secrets.STOLOTO_PASSWORD }}
        run: node update-top3.mjs

      - name: Commit verified live data
        run: |
          if git diff --quiet -- top3-live.json; then
            echo "Нет новых подтверждённых тиражей"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add top3-live.json
          git commit -m "TOP3: update from verified Stoloto OAuth (backup)"
          git push
