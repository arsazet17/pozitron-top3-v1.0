name: TOP-3 Stoloto backup updater

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: yulia-top3-stoloto-oauth
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Permanently switch updater to double verification
        shell: bash
        run: |
          python patch-update-top3-double.py
          if git diff --quiet -- update-top3.mjs; then
            echo "Updater already uses double verification"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add update-top3.mjs
            git commit -m "TOP3: permanent double Stoloto verification"
            git push origin HEAD:main
          fi

      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.54.2
          npx playwright install --with-deps chromium

      - name: Update from official Stoloto
        env:
          STOLOTO_EMAIL: ${{ secrets.STOLOTO_EMAIL }}
          STOLOTO_PASSWORD: ${{ secrets.STOLOTO_PASSWORD }}
        run: node update-top3.mjs

      - name: Commit verified live data
        shell: bash
        run: |
          if git diff --quiet -- top3-live.json; then
            echo "Нет новых подтверждённых тиражей"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add top3-live.json
          git commit -m "TOP3: update from verified Stoloto OAuth · double"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
