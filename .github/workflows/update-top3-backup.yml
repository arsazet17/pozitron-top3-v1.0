name: TOP-3 Stoloto backup updater

on:
  workflow_dispatch:
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'

permissions:
  contents: write

concurrency:
  group: yulia-top3-stoloto-oauth
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Switch Stoloto verification to double
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("update-top3.mjs")
          s = p.read_text(encoding="utf-8")
          old = s
          s = s.replace(
              "for (let i = 1; i <= 3; i += 1) {",
              "for (let i = 1; i <= 2; i += 1) {"
          )
          s = s.replace(
              "if (!sameSnapshot(passes[0], passes[1]) || !sameSnapshot(passes[1], passes[2])) {",
              "if (!sameSnapshot(passes[0], passes[1])) {"
          )
          s = s.replace(
              "throw new Error('три независимых чтения Столото не совпали — запись запрещена');",
              "throw new Error('два независимых чтения Столото не совпали — запись запрещена');"
          )
          s = s.replace(
              "Официальный Столото · OAuth · тройная проверка",
              "Официальный Столото · OAuth · двойная проверка"
          )
          if s == old:
              print("Updater already patched or expected markers not found")
          else:
              p.write_text(s, encoding="utf-8")
              print("Updater switched to DOUBLE verification")
          PY

      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.54.2
          npx playwright install --with-deps chromium

      - name: Backup update from official Stoloto
        env:
          STOLOTO_EMAIL: ${{ secrets.STOLOTO_EMAIL }}
          STOLOTO_PASSWORD: ${{ secrets.STOLOTO_PASSWORD }}
        run: node update-top3.mjs

      - name: Commit verified live data
        run: |
          if git diff --quiet -- top3-live.json; then
            echo "Нет новых подтверждённых тиражей"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add top3-live.json
          git commit -m "TOP3: update from verified Stoloto OAuth · double (backup)"
          git pull --rebase origin main
          git push origin HEAD:main
