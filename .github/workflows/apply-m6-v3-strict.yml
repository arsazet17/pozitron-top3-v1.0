name: Apply M6 V3 strict

on:
  push:
    paths:
      - 'm6-v3-strict.js'
      - '.github/workflows/apply-m6-v3-strict.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Enable M6 V3 strict
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          ver='1.2.14'

          p=Path('app.js')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r"const APP_VERSION='[^']+';",f"const APP_VERSION='{ver}';",s,count=1)
          p.write_text(s,encoding='utf-8')

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'v1\.2\.13',f'v{ver}',s)
          s=s.replace("window.TOP3_BUILD = '1.2.13';",f"window.TOP3_BUILD = '{ver}';")
          if 'm6-v3-strict.js' not in s:
              s=s.replace('<script src="./triple-methods.js?v=1.2.14"></script>','<script src="./triple-methods.js?v=1.2.14"></script>\n  <script src="./m6-v3-strict.js?v=1.2.14"></script>')
          p.write_text(s,encoding='utf-8')

          p=Path('sw.js')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r"const CACHE_NAME = '[^']+';", "const CACHE_NAME = 'yulia-top3-v1-2-14-m6-v3-strict';", s, count=1)
          s=s.replace('1.2.13','1.2.14')
          if "'./m6-v3-strict.js?v=1.2.14'" not in s:
              s=s.replace("'./triple-methods.css?v=1.2.14', './triple-methods.js?v=1.2.14',","'./triple-methods.css?v=1.2.14', './triple-methods.js?v=1.2.14', './m6-v3-strict.js?v=1.2.14',")
          p.write_text(s,encoding='utf-8')

          p=Path('manifest.webmanifest')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'"start_url":\s*"[^"]+"','"start_url": "./?v=1.2.14-m6-v3-strict"',s,count=1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html sw.js manifest.webmanifest m6-v3-strict.js
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "TOP3 v1.2.14: enable M6 V3 strict third+ repeat family"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
