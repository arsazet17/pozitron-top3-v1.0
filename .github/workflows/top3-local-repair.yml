name: TOP-3 local mismatch repair

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'patch-top3-local-repair.py'
      - '.github/workflows/top3-local-repair.yml'

permissions:
  contents: write

concurrency:
  group: yulia-top3-local-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Patch verified local repair
        run: python patch-top3-local-repair.py

      - name: Syntax check
        run: node --check app.js

      - name: Commit repair
        shell: bash
        run: |
          if git diff --quiet -- app.js index.html sw.js; then
            echo "Исправление уже установлено"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html sw.js
          git commit -m "TOP3: repair verified local mismatch and self-heal sync"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
