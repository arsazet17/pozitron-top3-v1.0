name: Refresh Yulia TOP-3 v1.1.0 now

on:
  push:
    paths:
      - 'refresh-v1.1.0-now.trigger'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: yulia-top3-stoloto-oauth
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.54.2
          npx playwright install --with-deps chromium
      - name: Update from official Stoloto with new 48-draw schedule
        env:
          STOLOTO_EMAIL: ${{ secrets.STOLOTO_EMAIL }}
          STOLOTO_PASSWORD: ${{ secrets.STOLOTO_PASSWORD }}
        run: node update-top3.mjs
      - name: Merge into full permanent archive
        run: node persist-top3-history.mjs
      - name: Commit refreshed data
        shell: bash
        run: |
          if git diff --quiet -- top3-live.json top3-history.json; then
            echo "Нет новых подтверждённых тиражей"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add top3-live.json top3-history.json
          git commit -m "TOP3 v1.1.0: refresh new 48-draw schedule data"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
