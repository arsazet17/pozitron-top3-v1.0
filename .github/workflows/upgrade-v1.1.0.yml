name: Upgrade Yulia TOP-3 v1.1.0

on:
  push:
    paths:
      - 'upgrade-v1.1.0.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply v1.1.0 migration
        run: node upgrade-v1.1.0.mjs
      - name: Rebuild permanent full archive
        run: node persist-top3-history.mjs
      - name: Commit upgraded application
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html styles.css sw.js update-top3.mjs persist-top3-history.mjs top3-history.json
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "Yulia TOP-3 v1.1.0: 48-draw schedule, full archive, triple analytics"
          git push
