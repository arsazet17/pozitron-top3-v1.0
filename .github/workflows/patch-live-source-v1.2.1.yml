name: Patch TOP3 live source v1.2.1

on:
  workflow_dispatch:
  push:
    paths:
      - 'patch-live-source-v1.2.1.mjs'
      - '.github/workflows/patch-live-source-v1.2.1.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch application live source and version
        run: node patch-live-source-v1.2.1.mjs
      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet -- app.js index.html sw.js; then
            echo "Patch already applied"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html sw.js
          git commit -m "TOP3 v1.2.1: read live archive directly from raw GitHub"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
