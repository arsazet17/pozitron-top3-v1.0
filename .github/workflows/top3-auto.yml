name: TOP3 Auto Update

on:
  workflow_dispatch:
  schedule:
    - cron: '17,47 * * * *'

permissions:
  contents: write

concurrency:
  group: top3-auto-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Скачать репозиторий
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Подготовить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Получить свежие тиражи
        run: node update-top3.mjs

      - name: Сохранить изменения
        shell: bash
        run: |
          if git diff --quiet -- top3-live.json; then
            echo "Новых тиражей нет — коммит не нужен."
            exit 0
          fi
          git config user.name "top3-auto-bot"
          git config user.email "top3-auto-bot@users.noreply.github.com"
          git add top3-live.json
          git commit -m "TOP3: обновить свежие тиражи"
          git push
