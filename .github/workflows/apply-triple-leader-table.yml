name: Apply triple leaders table

on:
  push:
    paths:
      - 'patch-m4-leader-table.py'
      - '.github/workflows/apply-triple-leader-table.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply M4 all-family-links leader table fix
        run: python3 patch-m4-leader-table.py
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add triple-methods.js app.js index.html sw.js manifest.webmanifest
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "TOP3 v1.2.6: fix M4 all-family-links leader table"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
