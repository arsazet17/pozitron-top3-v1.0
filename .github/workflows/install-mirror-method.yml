name: Install Yulia Mirror Method v1.0.28

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mirror-method.js'
      - 'mirror-method.css'
      - 'install-mirror-method.mjs'
      - '.github/workflows/install-mirror-method.yml'

permissions:
  contents: write

concurrency:
  group: yulia-top3-mirror-install
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install mirror method into Yulia TOP-3
        run: node install-mirror-method.mjs

      - name: Check JavaScript syntax
        run: |
          node --check mirror-method.js
          node mirror-method-test.mjs

      - name: Commit installed UI
        shell: bash
        run: |
          if git diff --quiet -- index.html manifest.webmanifest; then
            echo "Mirror Method already installed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html manifest.webmanifest
          git commit -m "Yulia TOP3: add Mirror Method v1.0.28"

          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort || true
            sleep $((attempt * 3))
          done

          echo "Не удалось отправить установочный commit после 3 попыток."
          exit 1
