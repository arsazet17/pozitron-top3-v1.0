name: Fix MAYACHOK strict NO-REUSE V2

on:
  push:
    paths:
      - '.github/workflows/apply-mayachok-v128.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove unverified MAYACHOK frozen patterns
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path('triple-methods.js')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r"const VERSION='[^']+';", "const VERSION='1.2.9';", s, count=1)

          # Strict V2: no type×distance pattern is allowed to become a signal
          # until it passes an independent frozen TRAIN→TEST validation.
          s,n=re.subn(
              r"const MAYACHOK_WATCH_V2=Object\.freeze\(\[.*?\]\);",
              "const MAYACHOK_WATCH_V2=Object.freeze([]);",
              s,
              count=1,
              flags=re.S
          )
          if n != 1:
              raise SystemExit(f'MAYACHOK watch matrix replacements={n}')

          s=s.replace(
              'Точный порядок цифр · NO-REUSE V2 · окно 50 завершённых тиражей. МАЯЧОК отвечает только «ТРОЙНЯ / НЕТ СИГНАЛА» и не смешивается с FROZEN M1/M2/M3.',
              'Точный порядок цифр · NO-REUSE V2 · окно 50 завершённых тиражей. Сигнал разрешён только по заранее подтверждённому frozen TRAIN→TEST шаблону. Сейчас подтверждённых V2-шаблонов: 0. МАЯЧОК не смешивается с FROZEN M1/M2/M3.'
          )
          s=s.replace(
              "const beaconMeta=beacon.matches.length?`Совпали: ${beacon.matches.map(x=>`${x.triple} · дистанция ${x.distance} · ${x.source.code}+${x.second.code}=${x.triple}`).join(' · ')}`:(beacon.active.length?`Активные разрешённые NO-REUSE схлопывания: ${beacon.active.map(x=>`${x.triple}@${x.distance}`).join(' · ')} · совпадений с frozen-матрицей МАЯЧКА нет`:'В дистанциях 1–20 разрешённых NO-REUSE схлопываний нет');",
              "const beaconMeta=beacon.matches.length?`Совпали подтверждённые frozen-шаблоны: ${beacon.matches.map(x=>`${x.triple}@${x.distance}`).join(' · ')}`:(beacon.active.length?`Подтверждённых frozen-шаблонов V2: 0 · активные NO-REUSE type@distance: ${beacon.active.map(x=>`${x.triple}@${x.distance}`).join(' · ')}`:'Подтверждённых frozen-шаблонов V2: 0 · в дистанциях 1–20 разрешённых NO-REUSE схлопываний нет');"
          )
          p.write_text(s,encoding='utf-8')

          p=Path('app.js')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r"const APP_VERSION='[^']+';", "const APP_VERSION='1.2.9';", s, count=1)
          p.write_text(s,encoding='utf-8')

          for name in ['index.html','sw.js','manifest.webmanifest']:
              p=Path(name); s=p.read_text(encoding='utf-8')
              s=s.replace('1.2.8','1.2.9')
              s=s.replace('yulia-top3-v1-2-8-mayachok-v2','yulia-top3-v1-2-9-mayachok-strict-v2')
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit strict MAYACHOK fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add triple-methods.js app.js index.html sw.js manifest.webmanifest
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "TOP3 v1.2.9: strict MAYACHOK V2, no unverified frozen patterns"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
