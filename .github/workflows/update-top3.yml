name: Update TOP-3 from Stoloto

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
  push:
    paths:
      - 'update-top3-api.mjs'
      - 'update-top3.mjs'
      - '.github/workflows/update-top3.yml'

permissions:
  contents: write

concurrency:
  group: yulia-top3-stoloto-api
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Try official Stoloto API
        id: api_update
        continue-on-error: true
        run: node update-top3-api.mjs

      - name: Install Chromium fallback
        if: steps.api_update.outcome == 'failure'
        run: |
          npm install --no-save playwright@1.54.2
          npx playwright install --with-deps chromium

      - name: Update through authenticated Stoloto browser
        if: steps.api_update.outcome == 'failure'
        env:
          STOLOTO_EMAIL: ${{ secrets.STOLOTO_EMAIL }}
          STOLOTO_PASSWORD: ${{ secrets.STOLOTO_PASSWORD }}
        run: node update-top3.mjs

      - name: Merge into permanent history
        run: node persist-top3-history.mjs

      - name: Commit verified live data
        shell: bash
        run: |
          if git diff --quiet -- top3-live.json top3-history.json; then
            echo "Нет новых подтверждённых тиражей"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add top3-live.json top3-history.json
          git commit -m "TOP3: auto-update verified live data"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
