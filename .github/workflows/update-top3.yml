name: Update TOP-3 from Stoloto

on:
  workflow_dispatch:
  schedule:
    - cron: '5,35 * * * *'
  push:
    paths:
      - 'update-top3-api.mjs'
      - '.github/workflows/update-top3.yml'

permissions:
  contents: write

concurrency:
  group: yulia-top3-stoloto-api
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Update from official Stoloto API
        run: node update-top3-api.mjs

      - name: Merge into permanent history
        run: node persist-top3-history.mjs

      - name: Commit verified live data
        shell: bash
        run: |
          if git diff --quiet -- top3-live.json top3-history.json; then
            echo "Нет новых подтверждённых тиражей"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add top3-live.json top3-history.json
          git commit -m "TOP3: auto-update from official Stoloto API"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
