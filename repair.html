<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#071b4d">
  <title>Обновление Yulia TOP-3</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(180deg,#071b4d,#030817);color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif;text-align:center}.card{width:min(100%,430px);padding:28px 22px;border:1px solid rgba(65,211,255,.28);border-radius:28px;background:rgba(6,20,54,.9);box-shadow:0 25px 70px rgba(0,0,0,.35)}img{width:92px;border-radius:24px}h1{font-size:25px;margin:16px 0 8px}p{color:#b9c8e9;line-height:1.5}.spin{width:28px;height:28px;margin:18px auto 0;border:3px solid rgba(65,211,255,.2);border-top-color:#41d3ff;border-radius:50%;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}.ok{color:#8fffc4;font-weight:800}.err{color:#ffb3bd}
  </style>
</head>
<body>
  <main class="card">
    <img src="icon-192.png" alt="Yulia TOP-3">
    <h1>Обновляю приложение</h1>
    <p id="status">Удаляю старую заставку и старый кэш. Архив тиражей и локальная база не удаляются.</p>
    <div class="spin" id="spin"></div>
  </main>
  <script>
    (async()=>{
      const status=document.getElementById('status');
      try{
        if('serviceWorker' in navigator){
          const regs=await navigator.serviceWorker.getRegistrations();
          await Promise.all(regs.map(reg=>reg.unregister()));
        }
        if('caches' in window){
          const keys=await caches.keys();
          await Promise.all(keys.map(key=>caches.delete(key)));
        }
        status.className='ok';
        status.textContent='Готово. Открываю настоящий главный экран…';
        setTimeout(()=>location.replace('./index.html?repair=1.0.3&t='+Date.now()),700);
      }catch(error){
        document.getElementById('spin').hidden=true;
        status.className='err';
        status.textContent='Не удалось очистить старый кэш. Закрой приложение и повтори открытие этой страницы.';
        console.error(error);
      }
    })();
  </script>
</body>
</html>
